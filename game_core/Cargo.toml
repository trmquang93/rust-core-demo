[package]
name = "game_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "game_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
