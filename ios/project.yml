name: GameDemo
options:
  bundleIdPrefix: dev.rustdemo
  # Generates Generated/game_core.swift first, so a fresh checkout's project includes it.
  preGenCommand: ../build-ios.sh dev
  deploymentTarget:
    iOS: "17.0"
# Separate target so the Rust build is finished before the app target touches the XCFramework.
# (A pre-build script phase inside the app target races with XCFramework processing.)
aggregateTargets:
  RustCore:
    buildScripts:
      - name: Build Rust core
        script: |
          MODE=dev
          [ "$CONFIGURATION" = "Release" ] && MODE=release
          "$SRCROOT/../build-ios.sh" "$MODE"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  GameDemo:
    type: application
    platform: iOS
    sources: [GameDemo]
    dependencies:
      - target: RustCore
    info:
      path: GameDemo/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rustdemo.GameDemo
        SWIFT_VERSION: "5.0"
        # Link the Rust static library directly: Xcode's XCFramework processing can keep a stale copy.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../build/headers
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": $(SRCROOT)/../build/lib/iphonesimulator/libgame_core.a
        "OTHER_LDFLAGS[sdk=iphoneos*]": $(SRCROOT)/../build/lib/iphoneos/libgame_core.a
